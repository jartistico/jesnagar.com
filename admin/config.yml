backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "img"

collections:
  # --- SECCIÓN 1: TUS OBRAS (Esto es lo que falta) ---
  - name: "obras"
    label: "🎨 Obras de Arte"
    folder: "_obras"
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Imagen de la Obra", name: "image", widget: "image"}
      - {label: "Año", name: "year", widget: "number", value_type: "int"}
      - {label: "Técnica (Español)", name: "technique_es", widget: "string", default: "Óleo sobre madera"}
      - {label: "Technique (English)", name: "technique_en", widget: "string", default: "Oil on wood"}
      - {label: "Medidas", name: "dimensions", widget: "string", required: false}
      - {label: "Enlace Spotify", name: "spotify_url", widget: "string", required: false, hint: "Pega aquí el enlace de la canción"}
      - {label: "Estado", name: "status", widget: "select", options: ["Disponible", "Colección Privada", "Vendido"], default: "Disponible"}

  # --- SECCIÓN 2: BLOG ---
  - name: "blog"
    label: "📝 Blog"
    folder: "blog"
    create: true
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Cuerpo", name: "body", widget: "markdown"}
